<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0805">
<title>ورود استاد</title>
<style>
:root{--g1:#F6D77A;--g2:#D4AF37;--g3:#B8860B;--cream:#F3E9D2;--soft:#B8A47C}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;padding:max(22px,env(safe-area-inset-top)) 18px max(26px,env(safe-area-inset-bottom));color:var(--cream);
 font-family:'Vazirmatn',Tahoma,system-ui,sans-serif;
 background:radial-gradient(120% 70% at 50% 0%,#2A200D 0%,#120E07 48%,#050403 100%) fixed;
 display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:420px;position:relative}
/* قاب دوگانهٔ طلایی */
.card{position:relative;margin-top:6px;padding:26px 20px 24px;border-radius:26px;
 background:linear-gradient(180deg,rgba(36,27,12,.72),rgba(10,8,4,.86));
 border:1.5px solid transparent;
 background-clip:padding-box;
 box-shadow:0 0 0 1px rgba(212,175,55,.35),0 18px 50px rgba(0,0,0,.65),inset 0 0 60px rgba(212,175,55,.05)}
.card::before{content:"";position:absolute;inset:-1.5px;border-radius:27px;z-index:-1;
 background:linear-gradient(135deg,#B8860B,#F6D77A 28%,#FFF3C4 50%,#D4AF37 72%,#B8860B)}
.card::after{content:"";position:absolute;inset:8px;border-radius:19px;pointer-events:none;border:1px solid rgba(212,175,55,.32)}
.dia{position:absolute;width:10px;height:10px;background:var(--g2);transform:rotate(45deg);z-index:2}
.dia.a{top:-6px;right:50%;margin-right:-5px}.dia.b{bottom:-6px;right:50%;margin-right:-5px}
/* لوگو */
.logo{position:relative;width:200px;height:200px;margin:-4px auto 0;display:block}
.logo::before{content:"";position:absolute;inset:-26px;border-radius:50%;
 background:radial-gradient(circle,rgba(246,215,122,.30),rgba(246,215,122,0) 68%)}
.logo img{position:relative;width:100%;height:100%;display:block;mix-blend-mode:lighten}
.rule{height:1px;margin:6px 6px 14px;background:linear-gradient(90deg,transparent,rgba(246,215,122,.85),transparent);position:relative}
.rule i{position:absolute;left:50%;top:-4px;width:8px;height:8px;margin-left:-4px;background:var(--g1);transform:rotate(45deg)}
h2{margin:0 0 4px;text-align:center;font-size:25px;font-weight:800;letter-spacing:.2px;
 background:linear-gradient(90deg,#B8860B,#F6D77A 30%,#FFF3C4 50%,#D4AF37 70%,#B8860B);
 -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:var(--soft);font-size:13px;margin:0 0 16px}
label{display:block;font-size:12.5px;color:var(--soft);margin:10px 4px 2px}
select,input,button{width:100%;margin:5px 0;padding:14px 14px;border-radius:14px;font-size:16px;font-family:inherit;outline:none}
select,input{border:1px solid rgba(212,175,55,.38);background:rgba(18,14,7,.85);color:var(--cream);
 transition:border-color .2s,box-shadow .2s}
select:focus,input:focus{border-color:var(--g1);box-shadow:0 0 0 3px rgba(246,215,122,.16)}
select{appearance:none;-webkit-appearance:none;
 background-image:linear-gradient(45deg,transparent 50%,#D4AF37 50%),linear-gradient(135deg,#D4AF37 50%,transparent 50%);
 background-position:18px 52%,24px 52%;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-left:42px}
input::placeholder{color:#7d6e4c}
input[type=password]{text-align:center;letter-spacing:8px;font-size:20px}
input[type=password]::placeholder{letter-spacing:0;font-size:15px}
button{margin-top:14px;border:0;cursor:pointer;font-weight:800;font-size:17px;color:#1B1204;
 background:linear-gradient(135deg,#B8860B 0%,#F6D77A 38%,#FFF3C4 52%,#D4AF37 75%,#B8860B 100%);
 box-shadow:0 6px 22px rgba(212,175,55,.35),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .12s,box-shadow .2s}
button:active{transform:scale(.985);box-shadow:0 2px 10px rgba(212,175,55,.3)}
button:disabled{opacity:.6}
#m{margin-top:12px;min-height:26px;text-align:center;color:#F0C868;font-size:14px}
.foot{margin-top:16px;text-align:center;color:#7d6e4c;font-size:11.5px}
</style></head><body>

var URL_='https://script.google.com/macros/s/AKfycbxLF0ZX8f2cnOAkdh8OjGAMwYilsGdrqMslVVgL_ipTWOfDe5s0Xz-tbSFUbl695EdT/exec',$=function(i){return document.getElementById(i);};
function b64e(u){var s='',i;for(i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function gz(u,c){var s=new (c?CompressionStream:DecompressionStream)('gzip'),w=s.writable.getWriter();w.write(u);w.close();return new Response(s.readable).arrayBuffer().then(function(b){return new Uint8Array(b);});}

function dec(s){s=s.trim();var u=b64d(s.slice(1));return (s[0]==='g'?gz(u,0):Promise.resolve(u)).then(function(x){return JSON.parse(new TextDecoder().decode(x));});}

function post(o){var ac=new AbortController(),t=setTimeout(function(){ac.abort();},30000);
