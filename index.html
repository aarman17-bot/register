<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ثبت‌نام در آموزشگاه موسیقی ایران</title>
<meta name="description" content="فرم ثبت‌نام آنلاین آموزشگاه موسیقی ایران">
<style>
@font-face{ font-family:'Vazirmatn-fallback'; src: local('Vazirmatn'), local('Vazirmatn UI'), local('Vazir'), local('Noto Sans Arabic'), local('Tahoma'); }
:root{
  --bg:#0A0806; --surface:#1B1712; --surface2:#241E15; --ink:#F3E9D2; --ink-soft:#B8A47C; --line:#4A3D22;
  --gold:#D4A03C; --gold-light:#F0C868; --gold-dark:#8B6420; --brick:#C0453A; --ok:#5FA86A;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  font-family:'Vazirmatn-fallback', Tahoma, Arial, sans-serif; color:var(--ink); line-height:1.8;
  background: radial-gradient(ellipse at 50% 0%, #1d1609 0%, #0A0806 55%, #000 100%); min-height:100vh;
}
.wrap{ max-width:520px; margin:0 auto; padding:0 16px 40px; }
header{ text-align:center; padding:38px 8px 22px; }
.mark{ font-size:44px; filter:drop-shadow(0 0 14px rgba(212,160,60,.45)); }
h1{ margin:6px 0 2px; font-size:24px; font-weight:800; color:var(--gold-light); letter-spacing:.2px; }
.sub{ color:var(--ink-soft); font-size:14px; }
.rule{ display:flex; align-items:center; gap:10px; margin:16px auto 0; max-width:260px; }
.rule i{ flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(212,175,55,.75)); }
.rule i:last-child{ background:linear-gradient(270deg,transparent,rgba(212,175,55,.75)); }
.rule b{ color:var(--gold); font-size:12px; }
.card{
  background:linear-gradient(160deg, rgba(36,30,21,.96), rgba(22,18,12,.96));
  border:1.5px solid rgba(212,175,55,.5); border-radius:20px; padding:22px 18px 20px;
  box-shadow:0 8px 28px rgba(0,0,0,.55), inset 0 0 0 1px rgba(212,175,55,.1);
}
label{ display:block; margin:0 0 14px; }
label > span{ display:block; font-size:14px; color:var(--ink-soft); margin-bottom:6px; }
label > span em{ color:var(--brick); font-style:normal; }
input, select, textarea{
  width:100%; font-family:inherit; font-size:16px; color:var(--ink); background:#120F0A;
  border:1.5px solid var(--line); border-radius:14px; padding:13px 14px; outline:none;
}
textarea{ resize:vertical; min-height:70px; }
input:focus, select:focus, textarea:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,160,60,.2); }
input[dir=ltr]{ text-align:right; }
.row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media (max-width:380px){ .row{ grid-template-columns:1fr; } }
button{
  width:100%; margin-top:6px; padding:15px; font-family:inherit; font-size:17px; font-weight:800; color:#1b1306;
  background:linear-gradient(180deg, var(--gold-light), var(--gold)); border:0; border-radius:16px; cursor:pointer;
  box-shadow:0 6px 18px rgba(212,160,60,.35);
}
button:disabled{ opacity:.6; cursor:default; }
.err{ color:var(--brick); font-size:14px; min-height:20px; margin:4px 0 6px; }
.hp{ position:absolute; opacity:0; width:0; height:0; overflow:hidden; pointer-events:none; }
html,body{ overflow-x:hidden; }
.done{ text-align:center; padding:18px 6px; }
.done .big{ font-size:46px; }
.done h2{ color:var(--gold-light); margin:8px 0; }
.done p{ color:var(--ink-soft); margin:6px 0; }
.note{ text-align:center; color:var(--ink-soft); font-size:12.5px; margin-top:16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">🎼</div>
    <h1>آموزشگاه موسیقی ایران</h1>
    <div class="sub">فرمِ ثبت‌نامِ آنلاین</div>
    <div class="rule"><i></i><b>◆</b><i></i></div>
  </header>

  <div class="card" id="formCard">
    <form id="f" novalidate autocomplete="on">
      <label><span>نام و نام خانوادگی <em>*</em></span><input id="name" name="name" autocomplete="name" placeholder="نام و نام خانوادگی" /></label>
      <label><span>شماره موبایل <em>*</em></span><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" dir="ltr" placeholder="09xxxxxxxxx" /></label>
      <label><span>سازِ موردِ علاقه</span>
        <select id="instrument" name="instrument">
          <option value="">— انتخاب کنید —</option>
          <option>گیتار</option><option>پیانو</option><option>ویولن</option><option>سه‌تار</option><option>تار</option>
          <option>سنتور</option><option>تنبک</option><option>آواز</option><option>فلوت / نی</option><option>درامز</option>
          <option>هنوز مطمئن نیستم</option>
        </select>
      </label>
      <div class="row">
        <label><span>روزِ دلخواه</span>
          <select id="day" name="day"><option value="">— فرقی ندارد —</option><option>شنبه</option><option>یکشنبه</option><option>دوشنبه</option><option>سه‌شنبه</option><option>چهارشنبه</option><option>پنجشنبه</option><option>جمعه</option></select>
        </label>
        <label><span>ساعتِ دلخواه</span>
          <select id="time" name="time"><option value="">— فرقی ندارد —</option><option>صبح</option><option>ظهر</option><option>عصر</option><option>شب</option></select>
        </label>
      </div>
      <label><span>تاریخ تولد (اختیاری)</span><input id="birth" name="birth" inputmode="numeric" dir="ltr" placeholder="۱۳۸۵/۰۵/۱۲" /></label>
      <label><span>توضیحات (اختیاری)</span><textarea id="note" name="note" placeholder="مثلاً سابقهٔ نوازندگی یا سؤالی که دارید"></textarea></label>
      <div class="hp" aria-hidden="true"><label>وب‌سایت<input id="website" name="website" tabindex="-1" autocomplete="off" /></label></div>
      <div class="err" id="err" role="alert"></div>
      <button type="submit" id="btn">ثبتِ درخواست</button>
    </form>
  </div>

  <div class="card done" id="doneCard" style="display:none">
    <div class="big">✅</div>
    <h2>درخواستِ شما ثبت شد</h2>
    <p>همکارانِ آموزشگاه به‌زودی در واتساپ با شما هماهنگ می‌کنند.</p>
    <p>پس از هماهنگی، تکمیلِ ثبت‌نام با پرداختِ شهریه و ارسالِ تصویرِ فیش انجام می‌شود.</p>
  </div>
  <div class="note">اطلاعاتِ شما فقط برایِ هماهنگیِ ثبت‌نام استفاده می‌شود.</div>
</div>

<script>
/* ⚠️ آدرسِ Web App گوگل (Apps Script) را اینجا بگذارید */
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPzjFd4omvZsJuL9onobOB47N0MR3IlEhqyAXi3__VZlhEh2KqsIs5cVdep8jF0oLbfw/exec";

function digits(s){ return String(s||"").replace(/[۰-۹]/g,function(c){return "۰۱۲۳۴۵۶۷۸۹".indexOf(c);}).replace(/[٠-٩]/g,function(c){return "٠١٢٣٤٥٦٧٨٩".indexOf(c);}); }
var f = document.getElementById("f"), err = document.getElementById("err"), btn = document.getElementById("btn");

f.addEventListener("submit", function(ev){
  ev.preventDefault(); err.textContent = "";
  var name = f.name.value.trim(), phone = digits(f.phone.value).replace(/[\s\-]/g,"");
  if(f.website.value){ return; }                         /* ربات‌ها */
  if(name.length < 3){ err.textContent = "نام و نام خانوادگی را وارد کنید."; f.name.focus(); return; }
  if(phone.indexOf("+98")===0) phone = "0"+phone.slice(3); else if(phone.indexOf("98")===0 && phone.length===12) phone = "0"+phone.slice(2);
  if(!/^09\d{9}$/.test(phone)){ err.textContent = "شمارهٔ موبایل را مثل 09123456789 وارد کنید."; f.phone.focus(); return; }
  try{ var last = Number(localStorage.getItem("reg_last")||0); if(Date.now()-last < 60000){ err.textContent = "لطفاً یک دقیقه صبر کنید و دوباره تلاش کنید."; return; } }catch(e){}
  if(!SCRIPT_URL || SCRIPT_URL.indexOf("PUT_")===0){ err.textContent = "فرم هنوز راه‌اندازی نشده است."; return; }
  btn.disabled = true; btn.textContent = "در حال ارسال…";
  var payload = { name:name, phone:phone, instrument:f.instrument.value, day:f.day.value, time:f.time.value,
                  birth:digits(f.birth.value).trim(), note:f.note.value.trim().slice(0,500), ts:new Date().toISOString() };
  fetch(SCRIPT_URL, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify(payload) })
    .then(function(){
      try{ localStorage.setItem("reg_last", String(Date.now())); }catch(e){}
      document.getElementById("formCard").style.display = "none";
      document.getElementById("doneCard").style.display = "block"; window.scrollTo(0,0);
    })
    .catch(function(){ err.textContent = "ارسال نشد؛ اینترنتِ خود را بررسی کنید و دوباره تلاش کنید."; btn.disabled = false; btn.textContent = "ثبتِ درخواست"; });
});
</script>
</body>
</html>
