<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0806">
<title>ثبت‌نام هنرجو — آموزشگاه موسیقی ایران</title>
<style>
:root{--cream:#12100C;--surface:#1B1712;--ink:#F3E9D2;--ink-soft:#B8A47C;--line:#4A3D22;--primary:#D4A03C;--primary-dark:#8B6420;--primary-bg:#2E2410;--amber:#F0C868;--brick:#C0453A;--stage:#0A0806;--stage-line:#3A2E18}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{font-family:'Vazirmatn',Tahoma,Arial,sans-serif;color:var(--ink);background:radial-gradient(120% 55% at 50% 0%,#2A200D 0%,#120E07 45%,#0A0806 100%) fixed;min-height:100vh;direction:rtl;padding:0 0 calc(175px + env(safe-area-inset-bottom))}
.hide{display:none!important}
header.top{text-align:center;padding:max(14px,env(safe-area-inset-top)) 10px 0}
.logo{position:relative;width:150px;height:150px;margin:0 auto}
.logo::before{content:"";position:absolute;inset:-22px;border-radius:50%;background:radial-gradient(circle,rgba(246,215,122,.28),rgba(246,215,122,0) 68%)}
.logo img{position:relative;width:100%;height:100%;display:block;mix-blend-mode:lighten}
.wz{max-width:480px;margin:6px auto 0;border:1.5px solid rgba(212,175,55,.55);border-radius:22px;background:var(--cream);overflow:hidden;box-shadow:0 0 0 1px rgba(212,175,55,.15),0 16px 44px rgba(0,0,0,.6)}
.wz-top{position:relative;padding:16px 18px 12px;text-align:center;background:linear-gradient(180deg,#3A2C10,#1B1712);border-bottom:1.5px solid rgba(212,175,55,.5)}
.wz-title{margin:0;font-size:24px;font-weight:800;color:var(--amber)}
.wz-sub{margin:2px 0 0;font-size:14px;font-weight:600;color:var(--ink-soft)}
.wiz-sum{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.wiz-sum:empty{display:none}
.wiz-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--primary-bg);border:1px solid var(--primary);font-size:12.5px;color:var(--ink)}
.wiz-chip i{font-style:normal}.wiz-chip b{font-weight:700}
.wz-body{padding:16px 14px 18px;min-height:300px}
/* ساز */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick-card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 6px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);font:inherit;cursor:pointer;transition:transform .12s,box-shadow .15s,border-color .12s,background .12s}
.pick-card .ic{width:68px;height:68px;line-height:0}
.pick-card .ic img{width:100%;height:100%;display:block;object-fit:contain;border-radius:50%}
.pick-card .ic svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 8px rgba(212,160,60,.25))}
.pick-card .lb{font-size:17px;font-weight:800;line-height:1.2;min-height:2.4em;display:flex;align-items:center;justify-content:center}
.pick-card:active{background:var(--primary-bg);border-color:var(--primary);transform:scale(.955);box-shadow:0 0 0 1px var(--primary) inset,0 0 20px rgba(240,200,104,.4)}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:26px 8px;font-size:15px;line-height:1.9}
/* روز و ساعت */
.sl-days{display:flex;flex-direction:column;gap:12px}
.sl-day{border:1.8px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface)}
.sl-day-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;background:linear-gradient(180deg,#2A2112,#1F1910);border-bottom:1.5px solid var(--line)}
.sl-teacher{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;min-width:0}
.sl-teacher .av{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#F6D27C,#B8842E);color:#1B1712;display:flex;align-items:center;justify-content:center}
.sl-teacher .av svg{width:62%;height:62%}
.sl-dayname{display:flex;align-items:center;gap:7px;font-size:19px;font-weight:800;color:var(--amber);flex-shrink:0}
.sl-dayname svg{width:22px;height:22px}
.sl-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.sl-slot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 4px;border-radius:14px;border:1.8px solid var(--line);background:var(--cream);color:var(--ink);font:inherit;font-size:20px;font-weight:800;cursor:pointer;direction:ltr}
.sl-slot:active{transform:scale(.97)}
.sl-radio{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--primary);display:flex;align-items:center;justify-content:center;color:transparent}
.sl-radio svg{width:72%;height:72%}
.sl-slot.selected{background:linear-gradient(180deg,#F8D987,#CB9A38 60%,#B8842E);border-color:#FBE6AE;color:#1B1712;box-shadow:0 0 18px rgba(240,200,104,.35)}
.sl-slot.selected .sl-radio{background:#1B1712;border-color:#1B1712;color:#F8D987}
.sl-alts{margin-top:14px;padding-top:12px;border-top:1.5px dashed var(--stage-line);display:flex;flex-direction:column;gap:8px}
.sl-chip{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 10px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.sl-chip:active{border-color:var(--primary);background:var(--primary-bg);color:var(--ink)}
.sl-chip-ic{width:22px;height:22px;color:var(--primary);display:flex}
.hd{margin:6px 2px 6px;font-size:14px;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{padding:11px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;cursor:pointer}
.chip.sel{border-color:var(--primary);background:var(--primary-bg);color:var(--amber);font-weight:800}
select{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;margin:4px 0 12px}
label.l{display:block;font-size:13.5px;color:var(--ink-soft);margin:8px 4px 2px}
/* نوع دوره */
.plan-card{width:100%;border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);color:var(--ink);font:inherit;text-align:right;cursor:pointer}
.plan-card.sel{border-color:var(--primary);background:var(--primary-bg);box-shadow:0 0 0 1px var(--primary) inset,0 4px 18px rgba(212,160,60,.12)}
.plan-name{display:block;font-size:19px;font-weight:800}
.plan-meta{display:block;font-size:14px;color:var(--ink-soft);margin-top:3px}
.plan-meta b{font-weight:700;margin-left:8px}.plan-meta i{font-style:normal}
.plan-price{font-size:18px;font-weight:800;color:var(--primary);white-space:nowrap}
/* مشخصات */
.glass-field{display:flex;align-items:center;gap:12px;margin:0 0 12px;padding:12px 14px;border-radius:16px;border:1.5px solid rgba(212,175,55,.38);background:rgba(27,23,18,.9)}
.glass-field-main{flex:1;min-width:0}
.glass-field-main span{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:3px}
.glass-field-main .req{display:inline;color:var(--brick)}
.glass-field input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;padding:2px 0}
.glass-field-icon{font-size:24px}
.hp{position:absolute;top:0;right:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.err{min-height:22px;color:#F29A8F;font-size:14px;text-align:center;margin:2px 0 4px}
/* تایید نهایی */
.pay-glass-card{border:1.5px solid rgba(212,175,55,.45);border-radius:18px;padding:6px 14px;background:linear-gradient(180deg,rgba(46,36,16,.6),rgba(27,23,18,.9))}
.pay-card-title{padding:10px 0;font-weight:800;color:var(--amber);border-bottom:1px solid var(--line)}
.pay-summary-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(74,61,34,.6);font-size:15px}
.pay-summary-row .lbl{color:var(--ink-soft)}.pay-summary-row .val{font-weight:700;text-align:left}
.pay-total-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-weight:800}
.pay-total-amount{color:var(--primary);font-size:19px}
.note2{margin-top:12px;padding:11px 13px;border-radius:14px;background:var(--primary-bg);border:1px solid var(--line);font-size:13.5px;line-height:1.9;color:var(--ink-soft)}
/* نوار پایین: مراحل + دکمه‌ها */
.wz-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(18,16,12,.94),#0E0B07);border-top:1.5px solid rgba(212,175,55,.45);z-index:5}
.wz-btns{display:flex;gap:10px;margin-bottom:10px}
.wz-back{flex:0 0 auto;min-width:110px;min-height:50px;padding:0 18px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.wz-next{flex:1;min-height:52px;border-radius:14px;border:0;font:inherit;font-size:18px;font-weight:800;color:#1B1204;cursor:pointer;background:linear-gradient(135deg,#B8860B 0%,#F6D77A 38%,#FFF3C4 52%,#D4AF37 75%,#B8860B 100%);box-shadow:0 6px 22px rgba(212,175,55,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.wz-next:active{transform:scale(.98)}
.wz-next.locked{opacity:.45;filter:grayscale(.35);box-shadow:none}
.wz-next:disabled{opacity:.6}
.wz-stepper{display:flex;align-items:flex-start;justify-content:center;gap:0}
.si{display:flex;flex-direction:column;align-items:center;gap:4px;width:52px}
.sc{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);background:var(--surface);color:var(--ink-soft);font-weight:800;font-size:15px}
.sc svg{width:56%;height:56%;display:block}
.si.done .sc{background:var(--primary-bg);border-color:var(--primary);color:var(--amber)}
.si.active .sc{background:linear-gradient(145deg,#F6D27C,#D4A03C 55%,#B8842E);border-color:#F6DE9E;color:#1B1712;transform:scale(1.12)}
.sl{font-size:11px;color:var(--ink-soft);font-weight:700;text-align:center;white-space:nowrap}
.si.done .sl{color:var(--ink)}.si.active .sl{color:var(--amber);font-weight:800}
.sa{flex:0 0 10px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--line)}
.sa svg{width:100%;height:12px}.si.done+.sa{color:var(--primary)}

/* پرداخت (مثل کیوسک) */
.pay-notice{border:1.5px solid rgba(212,160,60,.45);border-radius:18px;padding:12px 14px;margin-bottom:14px;background:linear-gradient(180deg,rgba(212,160,60,.1),rgba(212,160,60,.03))}
.pay-notice-title{color:var(--primary);font-weight:800;font-size:17px;margin-bottom:4px}
.pay-notice p{font-size:13.5px;color:var(--ink-soft);line-height:1.95;margin:6px 0}
.pay-notice-strong{color:var(--amber)!important;font-weight:800;text-align:center;font-size:14.5px!important}
.pay-gl{border:1.5px solid var(--line);border-radius:20px;padding:14px;margin-bottom:14px;background:rgba(27,23,18,.55)}
.pay-gl .pay-card-title{border:0;padding:0 0 12px;font-size:17px;color:var(--primary)}
.pay-bank-visual{position:relative;border-radius:18px;padding:20px 16px;margin-bottom:12px;text-align:center;background:linear-gradient(135deg,#3B2C0F,#17110A 60%,#2B200C);border:1.5px solid rgba(212,175,55,.6);box-shadow:inset 0 0 40px rgba(212,175,55,.08)}
.pay-bank-chip{width:38px;height:28px;border-radius:6px;margin:0 auto 12px;background:linear-gradient(145deg,#F6D27C,#B8842E)}
.pay-card-number{font-size:24px;font-weight:800;letter-spacing:2px;color:var(--amber);direction:ltr;word-break:break-all}
.pay-card-holder{font-size:14px;color:var(--ink-soft);margin-top:12px}
.pay-card-holder b{display:block;color:var(--ink);font-size:17px;margin-top:3px}
.pay-card-instruction{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink-soft);line-height:1.8}
.pay-card-receipt{font-size:13.5px;color:var(--ink-soft);line-height:1.9;margin-top:10px}
.pay-confirm-row{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;font-weight:800;cursor:pointer;margin:2px 0 8px}
.pay-confirm-row.checked{border-color:var(--primary);background:var(--primary-bg)}
.pay-confirm-row.shake{animation:shk .5s;border-color:var(--brick)}
.pay-checkbox{width:32px;height:32px;flex-shrink:0;border-radius:9px;border:2px solid var(--primary);display:flex;align-items:center;justify-content:center;font-size:20px;color:#1B1204}
.pay-checkbox.checked{background:linear-gradient(180deg,#F0C868,#B8862C);box-shadow:0 0 12px rgba(212,160,60,.5)}
.pay-steps{border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;margin:2px 0 12px;background:rgba(27,23,18,.55)}
.pay-steps-t{font-weight:800;color:var(--amber);font-size:15px;margin-bottom:6px}
.pay-step{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.9;color:var(--ink-soft);padding:3px 0}
.pay-step-n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--primary-bg);border:1.5px solid var(--primary);color:var(--amber);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:3px}
.pay-confirm-row.pulse{animation:payPulse 1.8s ease-in-out infinite;border-color:var(--primary)}
@keyframes payPulse{0%,100%{box-shadow:0 0 0 0 rgba(240,200,104,0)}50%{box-shadow:0 0 0 6px rgba(240,200,104,.28)}}
@keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* موفقیت */
.success{max-width:480px;margin:10px auto 0;padding:22px 16px 26px;text-align:center;border:1.5px solid rgba(212,175,55,.55);border-radius:22px;background:var(--cream)}
.success-badge{width:96px;height:96px}
.success-title{margin:8px 0 4px;font-size:23px;color:var(--amber)}
.success-orn{height:1px;margin:10px 40px;background:linear-gradient(90deg,transparent,#F6D77A,transparent);position:relative}
.success-orn i{position:absolute;left:50%;top:-4px;width:8px;height:8px;margin-left:-4px;background:#F6D77A;transform:rotate(45deg)}
.success-sub{color:var(--ink-soft);line-height:1.9;font-size:14.5px;margin:6px 4px 14px}
.success .pay-glass-card{text-align:right;margin:0 0 12px}
.success-note{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;border-radius:14px;background:var(--primary-bg);border:1px solid var(--line);font-size:13.5px;color:var(--ink);margin-bottom:14px;text-align:right}
.foot{max-width:480px;margin:14px auto 22px;text-align:center;color:#7d6e4c;font-size:12px}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;border:0;font:inherit;font-size:17px;font-weight:800;color:#fff;background:#25D366;text-decoration:none;margin:0 0 14px;box-shadow:0 6px 22px rgba(37,211,102,.28)}
.wa-btn:active{transform:scale(.98)}
.track-box{text-align:center;padding:10px;border-radius:14px;background:var(--primary-bg);border:1px solid var(--line);margin-bottom:14px;font-size:13.5px;color:var(--ink)}
.track-box b{display:block;font-size:22px;letter-spacing:3px;margin-top:2px;direction:ltr}
.late-note{font-size:13px;color:var(--ink-soft);text-align:center;line-height:1.9;margin-bottom:14px}
.bsel-row{display:flex;gap:8px;margin-top:6px;direction:rtl}
.bsel-row select{flex:1;min-width:0;min-height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:inherit;font-size:16px;padding:0 8px;text-align:center;text-align-last:center;appearance:none;-webkit-appearance:none}
.bsel-row select:focus{outline:none;border-color:#D4AF37}
.bsel-row option{background:#1a1507;color:#fff}
