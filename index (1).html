<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>آموزشگاه موسیقی ایران</title>
<style>
:root{--bg:#0A0806;--surface:#1B1712;--ink:#F3E9D2;--soft:#B8A47C;--line:#4A3D22;--gold:#D4A03C;--gold2:#F0C868;--brick:#C0453A;--ok:#5FA86A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Vazirmatn,Tahoma,Arial,sans-serif;color:var(--ink);line-height:1.8;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#1d1609,#0A0806 55%,#000)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{text-align:center;padding:30px 8px 14px}header .m{font-size:40px}h1{margin:4px 0 0;font-size:23px;color:var(--gold2)}
.tabs{display:flex;gap:6px;margin:12px 0 14px;background:#120F0A;border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:none;color:var(--soft);font:inherit;font-weight:700}
.tabs button.on{background:var(--gold);color:#1a1205}
.card{background:linear-gradient(160deg,#241E15f5,#16120Cf5);border:1.5px solid #D4AF3780;border-radius:20px;padding:20px 16px}
label{display:block;margin-bottom:12px}label>span{display:block;font-size:14px;color:var(--soft);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#120F0A;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hp{position:absolute;left:-9999px}
.go{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1205;font:inherit;font-size:17px;font-weight:800}
.go:disabled{opacity:.6}.err{color:var(--brick);min-height:22px;font-size:14px}
.hide{display:none}.ok{text-align:center}.ok b{font-size:44px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.top small{color:var(--soft)}
.link{background:none;border:1px solid var(--line);color:var(--soft);border-radius:10px;padding:6px 12px;font:inherit}
.day{margin:14px 0 4px;color:var(--gold2);font-weight:800;display:flex;gap:8px;align-items:center}.day i{font-style:normal;font-size:11px;background:var(--ok);color:#06200c;border-radius:8px;padding:0 8px}
.cl{display:flex;justify-content:space-between;padding:10px 12px;margin:6px 0;background:#120F0A;border:1px solid var(--line);border-radius:12px}
.cl b{color:var(--gold2);direction:ltr}.empty{color:var(--soft);font-size:14px;padding:6px 2px}
.note{text-align:center;color:var(--soft);font-size:12px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
<header><div class="m">🎼</div><h1>آموزشگاه موسیقی ایران</h1></header>
<div class="tabs"><button id="t1" class="on">ثبت‌نام هنرجو</button><button id="t2">ورود استاد</button></div>

<!-- ثبت‌نام -->
<div id="p1" class="card">
 <form id="f" novalidate>
  <label><span>نام و نام خانوادگی *</span><input id="name" autocomplete="name"></label>
  <label><span>شماره موبایل *</span><input id="phone" type="tel" inputmode="numeric" dir="ltr" placeholder="09xxxxxxxxx" autocomplete="tel"></label>
  <label><span>سازِ موردِ علاقه</span><select id="instrument"><option value="">— انتخاب کنید —</option><option>گیتار</option><option>پیانو</option><option>ویولن</option><option>سه‌تار</option><option>تار</option><option>سنتور</option><option>تنبک</option><option>آواز</option><option>فلوت / نی</option><option>درامز</option><option>هنوز مطمئن نیستم</option></select></label>
  <div class="row">
   <label><span>روزِ دلخواه</span><select id="day"><option value="">فرقی ندارد</option><option>شنبه</option><option>یکشنبه</option><option>دوشنبه</option><option>سه‌شنبه</option><option>چهارشنبه</option><option>پنجشنبه</option></select></label>
   <label><span>ساعتِ دلخواه</span><select id="time"><option value="">فرقی ندارد</option><option>صبح</option><option>ظهر</option><option>عصر</option><option>شب</option></select></label>
  </div>
  <label><span>تاریخ تولد (اختیاری)</span><input id="birth" inputmode="numeric" dir="ltr" placeholder="1385/05/12"></label>
  <label><span>توضیحات (اختیاری)</span><textarea id="note" rows="2"></textarea></label>
  <div class="hp"><input id="website" tabindex="-1" autocomplete="off"></div>
  <div class="err" id="err1"></div>
  <button class="go" id="b1" type="submit">ثبتِ درخواست</button>
 </form>
</div>
<div id="done" class="card ok hide"><b>✅</b><h2>درخواستِ شما ثبت شد</h2><p>همکارانِ آموزشگاه به‌زودی با شما هماهنگ می‌کنند.</p></div>

<!-- استاد -->
<div id="p2" class="card hide">
 <form id="lf" novalidate>
  <label><span>استاد</span><select id="tn"><option value="">در حال بارگذاری…</option></select></label>
  <label><span>کدِ ورود</span><input id="tc" type="password" dir="ltr" autocomplete="current-password"></label>
  <div class="err" id="err2"></div>
  <button class="go" id="b2" type="submit">ورود</button>
 </form>
 <div id="sched" class="hide"></div>
</div>
<div class="note">اطلاعاتِ شما فقط برای هماهنگیِ آموزشگاه استفاده می‌شود.</div>
</div>

<script>
/* ⚠️ آدرسِ Web App (Apps Script) را اینجا بگذارید */
var API = "https://script.google.com/macros/s/AKfycbxLF0ZX8f2cnOAkdh8OjGAMwYilsGdrqMslVVgL_ipTWOfDe5s0Xz-tbSFUbl695EdT/exec";
var $ = function(i){ return document.getElementById(i); };
var FA = "۰۱۲۳۴۵۶۷۸۹", fa = function(s){ return String(s).replace(/\d/g,function(d){return FA[d];}); };
var en = function(s){ return String(s||"").replace(/[۰-۹]/g,function(c){return FA.indexOf(c);}).replace(/[٠-٩]/g,function(c){return "٠١٢٣٤٥٦٧٨٩".indexOf(c);}); };
function call(o){ return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)}).then(function(r){return r.json();}); }
function tab(n){ $("t1").className=n==1?"on":""; $("t2").className=n==2?"on":""; $("p1").classList.toggle("hide",n!=1||$("done").dataset.d=="1"); $("done").classList.toggle("hide",n!=1||$("done").dataset.d!="1"); $("p2").classList.toggle("hide",n!=2); if(n==2) loadNames(); }
$("t1").onclick=function(){tab(1)}; $("t2").onclick=function(){tab(2)};

/* ثبت‌نام */
$("f").onsubmit=function(e){ e.preventDefault(); var er=$("err1"); er.textContent="";
 if($("website").value) return;
 var name=$("name").value.trim(), ph=en($("phone").value).replace(/[\s\-]/g,"");
 if(ph.indexOf("+98")==0) ph="0"+ph.slice(3); else if(/^98\d{10}$/.test(ph)) ph="0"+ph.slice(2);
 if(name.length<3){ er.textContent="نام و نام خانوادگی را وارد کنید."; return; }
 if(!/^09\d{9}$/.test(ph)){ er.textContent="شماره را مثل 09123456789 وارد کنید."; return; }
 if(API.indexOf("PUT_")==0){ er.textContent="فرم هنوز راه‌اندازی نشده است."; return; }
 $("b1").disabled=true; $("b1").textContent="در حال ارسال…";
 call({a:"reg",name:name,phone:ph,instrument:$("instrument").value,day:$("day").value,time:$("time").value,birth:en($("birth").value).trim(),note:$("note").value.trim().slice(0,500)})
 .then(function(r){ if(!r.ok) throw 0; $("done").dataset.d="1"; tab(1); window.scrollTo(0,0); })
 .catch(function(){ er.textContent="ارسال نشد؛ اینترنت را بررسی و دوباره تلاش کنید."; $("b1").disabled=false; $("b1").textContent="ثبتِ درخواست"; }); };

/* ورود استاد */
var loaded=false;
function loadNames(){ if(loaded||API.indexOf("PUT_")==0) return;
 call({a:"teachers"}).then(function(r){ loaded=true; $("tn").innerHTML=r.names.length?r.names.map(function(n){return "<option>"+n.replace(/</g,"&lt;")+"</option>";}).join(""):"<option value=''>هنوز برنامه‌ای منتشر نشده</option>"; }).catch(function(){}); }
$("lf").onsubmit=function(e){ e.preventDefault(); login($("tn").value,$("tc").value,false); };
function login(n,c,silent){ var er=$("err2"); er.textContent=""; if(!n||!c) return; $("b2").disabled=true;
 call({a:"login",name:n,code:c}).then(function(r){
  $("b2").disabled=false;
  if(!r.ok){ if(!silent) er.textContent=r.err=="locked"?"چند بار اشتباه زدید؛ ۱۰ دقیقه دیگر تلاش کنید.":"نام یا کدِ ورود درست نیست."; sessionStorage.removeItem("ac"); return; }
  sessionStorage.setItem("ac",JSON.stringify([n,c])); show(r.data);
 }).catch(function(){ $("b2").disabled=false; er.textContent="اتصال برقرار نشد."; }); }
var KEYS=["sat","sun","mon","tue","wed","thu","fri"], TODAY=KEYS[(new Date().getDay()+1)%7];
function show(d){ $("lf").classList.add("hide"); var s=$("sched"); s.classList.remove("hide");
 var days=d.days.slice().sort(function(a,b){return KEYS.indexOf(a.key.replace(/\d+$/,""))-KEYS.indexOf(b.key.replace(/\d+$/,""));});
 var h='<div class="top"><div><b>'+esc(d.name)+'</b><br><small>'+esc(d.instrument)+' · بروزرسانی: '+fa(new Date(d.updated).toLocaleString("fa-IR"))+'</small></div><button class="link" id="out">خروج</button></div>';
 days.forEach(function(x){ var today=x.key.replace(/\d+$/,"")==TODAY;
  h+='<div class="day">'+esc(x.label)+(today?'<i>امروز</i>':'')+'</div>';
  h+=x.classes.length?x.classes.map(function(c){ return '<div class="cl"><span>'+esc(c.student)+(c.double?' <small>(۲ ساعته)</small>':'')+'</span><b>'+fa(c.time)+'</b></div>'; }).join(""):'<div class="empty">کلاسی ثبت نشده</div>'; });
 s.innerHTML=h||'<div class="empty">برنامه‌ای نیست</div>'; $("out").onclick=function(){ sessionStorage.removeItem("ac"); location.reload(); }; }
function esc(t){ return String(t==null?"":t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
try{ var s=JSON.parse(sessionStorage.getItem("ac")||"null"); if(s){ tab(2); login(s[0],s[1],true); } }catch(e){}
</script>
</body>
</html>
