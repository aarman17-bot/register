<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0806">
<title>پنل هنرجو — آموزشگاه موسیقی ایران</title>
<style>
:root{--cream:#12100C;--surface:#1B1712;--surface2:#221C13;--ink:#F3E9D2;--ink-soft:#B8A47C;--line:#4A3D22;--gold:#D4A03C;--gold-hi:#F6D77A;--gold-lo:#B8842E;--gold-bg:#2E2410;--amber:#F0C868;--ok:#6FBF8E;--bad:#D9695C;--stage:#0A0806}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{font-family:'Vazirmatn',Tahoma,Arial,sans-serif;color:var(--ink);background:radial-gradient(120% 55% at 50% 0%,#2A200D 0%,#120E07 45%,#0A0806 100%) fixed;min-height:100vh;direction:rtl;padding:0 0 calc(32px + env(safe-area-inset-bottom));line-height:1.7}
.hide{display:none!important}
button,input{font:inherit;color:inherit}
header.top{text-align:center;padding:max(16px,env(safe-area-inset-top)) 10px 0}
.logo{position:relative;width:128px;height:128px;margin:0 auto}
.logo::before{content:"";position:absolute;inset:-24px;border-radius:50%;background:radial-gradient(circle,rgba(246,215,122,.30),rgba(246,215,122,0) 68%)}
.logo img{position:relative;width:100%;height:100%;display:block;mix-blend-mode:lighten}
.ttl{margin:4px 0 0;font-size:25px;font-weight:800;background:linear-gradient(180deg,#FBE6AE,#D4A03C 60%,#B8842E);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;font-size:13.5px;color:var(--ink-soft)}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px auto 4px;max-width:260px;color:var(--gold)}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-lo),transparent)}
.orn b{font-size:12px;font-weight:400}
main{max-width:480px;margin:0 auto;padding:6px 14px 0}
.card{position:relative;margin:14px 0 0;border:1.5px solid rgba(212,175,55,.5);border-radius:22px;background:var(--cream);box-shadow:0 0 0 1px rgba(212,175,55,.12),0 14px 38px rgba(0,0,0,.55);overflow:hidden}
.card.pad{padding:18px 16px}
.card-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;font-weight:800;color:var(--amber)}
.card-h svg{width:20px;height:20px;flex:none}
.lbl{display:block;margin:10px 4px 4px;font-size:13px;color:var(--ink-soft)}
.in{width:100%;padding:15px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:19px;letter-spacing:1px;text-align:center;direction:ltr;outline:none}
.in:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,160,60,.18)}
.pins{display:flex;gap:10px;direction:ltr;justify-content:center}
.pins .in{width:58px;padding:14px 0;font-size:24px;font-weight:800}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 14px;border-radius:16px;border:1.5px solid rgba(251,230,174,.7);background:linear-gradient(180deg,#F8D987,#CB9A38 60%,#B8842E);color:#1B1712;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 8px 22px rgba(212,160,60,.28);margin-top:16px}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.6}
.btn.ghost{background:var(--surface);color:var(--amber);border-color:var(--line);box-shadow:none;font-size:15px;margin-top:10px}
.err{margin:12px 2px 0;color:var(--bad);font-size:14px;text-align:center;min-height:1.4em}
.chk{display:flex;align-items:center;gap:9px;margin:14px 4px 0;font-size:14px;color:var(--ink-soft);cursor:pointer}
.chk input{width:19px;height:19px;accent-color:#D4A03C}
.help{margin:14px 4px 0;font-size:13px;color:var(--ink-soft);text-align:center;line-height:1.9}
/* kid tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0;justify-content:center}
.tab{padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;cursor:pointer}
.tab.on{border-color:var(--gold-hi);background:linear-gradient(180deg,#3A2C10,#2A200D);color:var(--amber);font-weight:800;box-shadow:0 0 14px rgba(240,200,104,.25)}
/* hero */
.hero{padding:20px 16px 18px;text-align:center;background:linear-gradient(180deg,#2F2411 0%,#15110A 70%)}
.hero h2{margin:0;font-size:24px;font-weight:800;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:10px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--gold-bg);border:1px solid var(--gold-lo);font-size:13px;color:var(--ink)}
.chip svg{width:15px;height:15px;color:var(--gold)}
.ring{position:relative;width:176px;height:176px;margin:16px auto 4px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:#3A2E18}
.ring .arc{stroke:url(#gg);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px rgba(246,215,122,.45))}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:38px;font-weight:800;line-height:1.1;background:linear-gradient(180deg,#FBE6AE,#D4A03C);-webkit-background-clip:text;background-clip:text;color:transparent}
.ring .of{font-size:13px;color:var(--ink-soft)}
.rem{font-size:14.5px;color:var(--ink-soft)}
.rem b{color:var(--amber)}
/* next */
.next{display:flex;align-items:center;gap:14px;padding:16px}
.next .ico{flex:none;width:54px;height:54px;border-radius:16px;background:linear-gradient(145deg,#F6D27C,#B8842E);color:#1B1712;display:flex;align-items:center;justify-content:center}
.next .ico svg{width:28px;height:28px}
.next .t1{font-size:13px;color:var(--ink-soft)}
.next .t2{font-size:19px;font-weight:800;color:var(--ink)}
.next .t3{font-size:14px;color:var(--amber);font-weight:700}
.next .cd{margin-right:auto;flex:none;text-align:center;padding:6px 12px;border-radius:14px;border:1.5px solid var(--gold);background:var(--gold-bg);color:var(--amber);font-size:15px;font-weight:800;white-space:nowrap}
/* banner */
.ban{margin:14px 0 0;padding:14px 16px;border-radius:18px;border:1.5px solid var(--gold-hi);background:linear-gradient(135deg,#3A2C10,#241B0C);display:flex;gap:12px;align-items:flex-start;box-shadow:0 0 22px rgba(240,200,104,.18)}
.ban svg{flex:none;width:26px;height:26px;color:var(--gold-hi)}
.ban b{display:block;color:var(--amber);font-size:15.5px}
.ban span{font-size:13.5px;color:var(--ink-soft)}
.ban.soft{border-color:var(--line);background:var(--surface);box-shadow:none}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.stat{padding:14px 6px;text-align:center;border-left:1px solid var(--line)}
.stat:last-child{border-left:none}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--amber);line-height:1.2}
.stat span{font-size:12.5px;color:var(--ink-soft)}
.streak{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);font-size:14px;color:var(--amber);background:linear-gradient(180deg,#1B1610,#15110A)}
/* timeline */
.tl{list-style:none;margin:0;padding:4px 16px 16px;position:relative}
.tl::before{content:"";position:absolute;top:18px;bottom:26px;right:35px;width:2px;background:linear-gradient(180deg,var(--gold-lo),var(--line))}
.tl li{position:relative;display:flex;align-items:center;gap:12px;padding:9px 0}
.dot{position:relative;z-index:1;flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;border:2px solid var(--line);background:var(--surface);color:var(--ink-soft)}
.dot svg{width:18px;height:18px}
.tl .ok .dot{background:linear-gradient(145deg,#F6D27C,#B8842E);border-color:#FBE6AE;color:#1B1712}
.tl .no .dot{background:#3A1A16;border-color:var(--bad);color:var(--bad)}
.tl .nx .dot{border-color:var(--gold-hi);color:var(--amber);box-shadow:0 0 0 4px rgba(240,200,104,.16);background:var(--gold-bg)}
.tl .row{flex:1;min-width:0}
.tl .d{font-size:15.5px;font-weight:700}
.tl .s{font-size:12.5px;color:var(--ink-soft)}
.tl .no .s{color:var(--bad)}
.tl .nx .s{color:var(--amber)}
.tl .cn{font-size:12px;color:var(--ink-soft);opacity:.85}
.tag{display:inline-block;margin-right:6px;padding:0 8px;border-radius:99px;border:1px solid var(--gold-lo);font-size:11.5px;color:var(--amber);font-weight:600}
/* info */
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 16px;border-top:1px solid #2A2216;font-size:14.5px}
.kv:first-of-type{border-top:none}
.kv span{color:var(--ink-soft)}
.kv b{font-weight:700;text-align:left}
.hist{padding:4px 16px 14px;display:flex;flex-direction:column;gap:6px}
.hist div{display:flex;justify-content:space-between;font-size:14px;padding:6px 10px;border-radius:10px;background:var(--surface)}
.hist div span{color:var(--ink-soft)}
.foot{max-width:480px;margin:22px auto 0;padding:0 18px;text-align:center;font-size:12.5px;color:var(--ink-soft);line-height:1.9}
.link{background:none;border:none;color:var(--amber);text-decoration:underline;font-size:13.5px;cursor:pointer;padding:6px}
.off{margin:12px 0 0;padding:9px 12px;border-radius:12px;background:var(--surface);border:1px dashed var(--line);font-size:13px;color:var(--ink-soft);text-align:center}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(27,23,18,.3);border-top-color:#1B1712;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card,.ban{animation:up .45s both}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}
@media (prefers-reduced-motion:reduce){.card,.ban{animation:none}.ring .arc{transition:none}}
</style></head><body>

  if(r&&r.err==="nodata") throw "اطلاعاتِ پنل هنوز منتشر نشده است. کمی بعد دوباره امتحان کنید.";

}

function addToCalendar(k){
